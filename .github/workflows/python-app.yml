# Tests de FastSweep à chaque push et pull request sur main.
# FastSweep n'existe que sous Windows (winreg, API Win32) : les tests tournent sur un runner Windows,
# avec la plus ancienne et la plus récente version de Python prises en charge.
# FastSweep tests on every push and pull request to main.
# FastSweep only exists on Windows (winreg, Win32 APIs): tests run on a Windows runner,
# with the oldest and the newest supported Python versions.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes

      - name: Lint with pyflakes
        run: python -m pyflakes fastsweep tests main.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
