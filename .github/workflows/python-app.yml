# Tests de FastSweep à chaque push et pull request sur main.
# FastSweep n'existe que sous Windows (winreg, API Win32) : les tests tournent sur un runner Windows,
# avec la plus ancienne et la plus récente version de Python prises en charge, et sur Windows ARM64.
# FastSweep tests on every push and pull request to main.
# FastSweep only exists on Windows (winreg, Win32 APIs): tests run on a Windows runner,
# with the oldest and the newest supported Python versions, and on Windows ARM64.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15  # un blocage s'arrête seul / a hang stops by itself
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, python-version: "3.10" }
          - { runner: windows-latest, arch: x64, python-version: "3.13" }
          # Python n'existe en ARM64 pour Windows que depuis la 3.11. / Python exists as ARM64 for Windows only since 3.11.
          - { runner: windows-11-arm, arch: arm64, python-version: "3.13" }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python ${{ matrix.python-version }} (${{ matrix.arch }})
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes
          # Pas de wheel cryptography pour Windows ARM64 : ses tests (signature, désactivée) sont alors sautés.
          # No cryptography wheel for Windows ARM64: its tests (signing, disabled) are then skipped.
          if ("${{ matrix.arch }}" -eq "x64") { python -m pip install cryptography }

      - name: Lint with pyflakes
        run: python -m pyflakes fastsweep tests tools main.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
